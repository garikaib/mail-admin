#!/usr/sbin/nft -f

# Define sets in the IPv4 (ip) filter table
table ip filter {
    set geo_mail_bans {
        type ipv4_addr
        flags timeout
    }
    set geo_ssh_bans {
        type ipv4_addr
        flags timeout
    }
    chain INPUT {
        tcp dport { 25, 465, 587, 110, 995, 143, 993 } ip saddr @geo_mail_bans drop
        tcp dport { 22 } ip saddr @geo_ssh_bans drop
    }
}

# Define sets in the IPv6 (ip6) filter table
table ip6 filter {
    set geo_mail_bans_v6 {
        type ipv6_addr
        flags timeout
    }
    set geo_ssh_bans_v6 {
        type ipv6_addr
        flags timeout
    }
    chain INPUT {
        tcp dport { 25, 465, 587, 110, 995, 143, 993 } ip6 saddr @geo_mail_bans_v6 drop
        tcp dport { 22 } ip6 saddr @geo_ssh_bans_v6 drop
    }
}
