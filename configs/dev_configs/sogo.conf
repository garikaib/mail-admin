// SOGo sogo.conf (Development Sandbox Config)
{
  SOGoProfileURL = "mysql://sogo:Password@127.0.0.1:3306/sogo/sogo_user_profile";
  OCSFolderInfoURL = "mysql://sogo:Password@127.0.0.1:3306/sogo/sogo_folder_info";
  OCSSessionsFolderURL = "mysql://sogo:Password@127.0.0.1:3306/sogo/sogo_sessions_folder";

  SOGoSieveServer = "sieve://127.0.0.1:4190";
  SOGoSMTPServer = "127.0.0.1:25";
  SOGoMailDomain = "zimprices.co.zw";

  SOGoUserSources = (
    {
      type = sql;
      id = directory;
      view = sogo_view;
      addressBook = YES;
      displayName = "ZimPrices Directory";
      c_uid = c_uid;
      c_name = c_name;
      c_cn = c_cn;
      c_password = c_password;
      mail = mail;
      isAddressBook = YES;
    }
  );

  SOGoLanguage = English;
  SOGoTimeZone = Africa/Harare;
  SOGoSuperUsernames = (admin);
}
