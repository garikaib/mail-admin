# Dovecot dovecot.conf (Development Sandbox Config)

protocols = imap lmtp pop3
listen = *, ::

# Authentication
auth_mechanisms = plain login
!include conf.d/*.conf

# Mailbox locations
mail_location = maildir:/var/vmail/%d/%n
mail_uid = vmail
mail_gid = vmail
mail_privileged_group = vmail

service auth {
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
  unix_listener private/auth {
    mode = 0666
    user = postfix
    group = postfix
  }
}

service lmtp {
  unix_listener private/dovecot-lmtp {
    mode = 0660
    group = postfix
    user = postfix
  }
}

protocol lda {
  # Add mail plugins
}
